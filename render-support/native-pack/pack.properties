name=Native GFL 2
author=CRASHCRASHCRASH
description=Original Native scene and post settings with common GF2 character materials and lighting inputs.
base=default
options=characterSoftFill characterDisplayStrength characterSurfaceDetail characterSkinGloss characterOutlineWidth
option.characterOutlineWidth.label=人物描边粗细
option.characterOutlineWidth.tooltip=缩放人物原材质的描边宽度。1 保持原效果。
option.characterOutlineWidth.range=0.75 1.35 0.01
option.characterOutlineWidth.default=1
option.characterOutlineWidth.kept=true
option.characterSurfaceDetail.label=皮肤凹凸细节
option.characterSurfaceDetail.tooltip=加强原法线的凹凸，例如腹部起伏与皮肤细纹。0 为原效果。
option.characterSurfaceDetail.range=0 1 0.01
option.characterSurfaceDetail.default=0
option.characterSurfaceDetail.kept=true
option.characterSkinGloss.label=皮肤高光集中度
option.characterSkinGloss.tooltip=降低皮肤材质粗糙度，让原有反光更集中。0 为原效果。
option.characterSkinGloss.range=0 1 0.01
option.characterSkinGloss.default=0
option.characterSkinGloss.kept=true
option.characterSoftFill.label=人物柔和底灯
option.characterSoftFill.tooltip=轻微增加偏中性的视角补光，让人物更清透；随环境亮度变化。0 恢复原效果，只影响人物，不改变场景灯光。
option.characterSoftFill.range=0 0.5 0.01
option.characterSoftFill.default=0.08
option.characterSoftFill.kept=true
option.characterDisplayStrength.label=原游人物显示还原强度
option.characterDisplayStrength.tooltip=所有已接入人物共用。0 为旧人物显示路径，1 为完整原游显示转换；不改变场景灯光、曝光和后处理。与人物底灯独立。
option.characterDisplayStrength.range=0 1 0.01
option.characterDisplayStrength.default=0.5
option.characterDisplayStrength.kept=true
